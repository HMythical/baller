name: Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  validate:
    name: Validate Repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate required directories exist
        run: python scripts/validate_structure.py

      - name: Check for forbidden files and directories
        run: python scripts/detect_artifacts.py

  build-linux:
    needs: [validate]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up GitHub Actions variables
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "value=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build Linux release
        run: |
          BALLER_PROFILE=release BALLER_TARGET=x86_64-unknown-linux-gnu ./build/linux/build.sh release

      - name: Create tar.gz archive
        run: ./build/linux/build.sh dist

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v4
        with:
          name: baller-linux-${{ steps.version.outputs.value }}
          path: build/linux/dist/
          retention-days: 7

  build-windows:
    needs: [validate]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build Windows release
        shell: pwsh
        run: ./build/winbuild/build.ps1 -Profile Release

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: baller-windows-${{ needs.build-linux.outputs.version }}
          path: build/winbuild/dist/
          retention-days: 7

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            baller-linux-*/**
            baller-windows-*/**
          generate_release_notes: true
