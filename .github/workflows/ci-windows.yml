name: CI - Windows

on:
  push:
    branches: [ rootdev ]
    paths:
      - 'src/**'
      - 'build/winbuild/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [ rootdev ]
    paths:
      - 'src/**'
      - 'build/winbuild/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Run build test (test command)
        shell: pwsh
        run: ./build/winbuild/build.ps1 test
