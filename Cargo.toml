[package]
name = "baller"
version = "0.1.0"
edition = "2021"
authors = ["HMythical <baller.support@gmail.com>"]
description = "A package manager for Windows & Linux Similar to Chocolatey, but with a sense of syntactical humor!"
license = "Apache-2.0"
repository = "https://github.com/HMythical/baller.git"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
indicatif = "0.18.4"
reqwest = { version = "0.13.3", features = ["blocking", "json"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
thiserror = "2.0.18"
toml = "1.1.2"
zip = "2"
flate2 = "1.1"
tar = "0.4"
bzip2 = "0.5"
xz2 = "0.1"
hex = "0.4"
semver = "1.0"
url = "2.5"
