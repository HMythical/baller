[package]
name = "baller"
version = "0.1.0"
edition = "2021"
authors = ["HMythical <baller.support@gmail.com>"]
description = "A package manager for Windows & Linux Similar to Chocolatey, but with a sense of syntactical humor!"
license = "Apache-2.0"
repository = "https://github.com/HMythical/baller.git"

[dependencies]
anyhow = "1.0.101"
thiserror = "1.0"
clap = {version = "4.5.57", features = ["derive"]}
serde = {version = "1.0.228", features = ["derive"]}
serde_json = "1.0.149"
toml = "0.9.8"
tokio = { version = "1.48.0", features = ["full"]}
ring = "0.17.11"
x509-parser = "0.18.1"
indicatif = "0.18.0"
console = "0.16.2"
log = "0.4.29"
env_logger = "0.11.7"
directories = "6.0.0"




[target.'cfg(target_os = "linux")'.dependencies]
nix = "0.31.0"
libc = "0.2.180"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = {version = "0.48", features = ["Win32_Foundation"]}
winreg = "0.55.0"
